[project]
name = "maibot-qq-voice-call-local"
version = "0.2.0"
description = "Windows QQ 手动接听、本地语音服务和 MaiBot 对话桥接"
requires-python = ">=3.12"
dependencies = [
  "maibot-plugin-sdk>=2.12.0,<3",
  "httpx>=0.28.1,<1",
  "sounddevice>=0.5.1,<0.6",
  "webrtcvad-wheels>=2.0.14,<3",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1.1,<2", "fastapi>=0.116", "uvicorn>=0.35", "python-multipart>=0.0.20"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
